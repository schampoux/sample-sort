rules: 
  - pattern: (?i).*loop.*
    category: Loops

  - pattern: (?i).*(fx|sweep|riser|impact).*
    category: FX

  - pattern: (?i).*(vocal|voice|chant|whisper).*
    category: Vocals

  - pattern: (?i).*bass.*
    category: Instruments/Bass
    
  - pattern: (?i).*license.*
    category: License

  - pattern: (?i).*midi.*
    category: MIDI

  - pattern: (?i).*guitar.*
    category: Strings/Guitar
  
  - pattern: (?i).*(pluck|stab).*
    category: One-Shots
  
  - pattern: (?i).*sub.*
    category: Sub-bass

  - pattern: (?i).*kick.*
    category: Drums/Kicks

  - pattern: (?i).*snare.*
    category: Drums/Snare

  - pattern: (?i).*hat.*
    category: Drums/Hats

  - pattern: (?i).*clap.*
    category: Drums/Claps

  - pattern: (?i).*melody.*
    category: Loops